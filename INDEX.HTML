<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaydorra Wedding Pro Kit</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff0f5; text-align: center; padding: 50px; }
    .card { background: white; padding: 30px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { color: #d63384; }
    input, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #d63384; color: white; border: none; font-size: 16px; cursor: pointer; }
    button:hover { background: #b82d6f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jaydorra Wedding Pro Kit</h1>
    <p>Get 500+ Wedding Templates, Contracts, Checklists + Bonus $10,000 Value</p>
    <p><b>Price: $27</b></p>
    <input type="text" id="phone" placeholder="Enter WhatsApp Number with country code e.g. 26097xxxxxxx">
    <button onclick="buyNow()">Buy Now & Get Instant Access</button>
    <p id="status"></p>
  </div>

  <script>
    async function buyNow() {
      const phone = document.getElementById('phone').value;
      if(!phone) { alert("Please enter your WhatsApp number"); return; }
      
      document.getElementById('status').innerText = "Processing payment...";
      
      // 1. HERE WE WILL ADD PAYMENT LINK LATER
      // For now we simulate payment success
      
      // 2. Call backend to send files
      const res = await fetch("https://your-backend-url.onrender.com/send_files", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({phone: phone, amount: "$27"})
      });
      
      if(res.ok) {
        document.getElementById('status').innerText = "Success! Check your WhatsApp for download link 🎉";
      } else {
        document.getElementById('status').innerText = "Error. Please try again.";
      }
    }
  </script>
</body>
</html>
